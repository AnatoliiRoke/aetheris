# gitleaks configuration (task 00002, section 2.6).
# The default rules apply. The allow list only covers values that are public by design.
[extend]
useDefault = true

[allowlist]
description = "Public test values"
regexes = [
  # The throwaway password of the PostgreSQL service container of the CI workflow.
  '''Username=postgres;Password=postgres''',
]

# Test accounts carry fixed throwaway passwords that the generic-api-key rule takes for keys
# (task 00021). The rule keeps its default regex and only skips the test folders; every
# other rule still scans them, and the rule still scans the rest of the repository.
[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "Throwaway passwords of the test accounts"
paths = [
  '''(^|/)tests/''',
  '''(^|/)__tests__/''',
  # The documents describe the check itself (an example line of the test of the scanner) and the
  # reference page of the author keeps the name of a storage key of a mockup; neither holds a key.
  '''^documentation/tasks/00021-ci-vynyatky-gitleaks-stabilizatsiia-testiv-zalezhnosti\.md$''',
  '''^documentation/references/vybir-zi-zorianoi-federatsii\.html$''',
]
