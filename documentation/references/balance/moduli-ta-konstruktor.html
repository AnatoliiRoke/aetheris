<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Модулі, корпуси й конструктор</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1915; --muted: #5c564c; --line: #e4ddd2; --paper: #f7f4ee; --card: #fff;
    --mark: #0f6b4c; --mark-bg: #e7f5ee; --warn: #8a4b00; --warn-bg: #fff3e0;
    --bad: #9b2c1f; --bad-bg: #fbeae7; --changed-bg: #fff8d6; --changed-line: #e6cf6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Iowan Old Style", Palatino, Georgia, serif; color: var(--ink); background: var(--paper); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(247, 244, 238, 0.97); border-bottom: 1px solid var(--line); padding: 10px 16px 8px; }
  h1 { margin: 0 0 2px; font-size: 1.25rem; }
  header p { margin: 0 0 6px; color: var(--muted); font-size: 0.88rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  button { padding: 5px 10px; cursor: pointer; }
  button:hover { background: #f0ebe3; }
  button.tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.small { padding: 0 6px; font-size: 0.8rem; }
  button.danger { color: var(--bad); }
  input[type="number"] { width: 5.5em; padding: 1px 3px; text-align: right; }
  input.text { width: 14em; padding: 1px 4px; }
  select { padding: 1px 2px; max-width: 12em; }
  main { padding: 10px 16px 40px; }
  .note { color: var(--muted); margin: 0 0 8px; max-width: 80em; }
  .scroll { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); max-height: 80vh; width: 100%; }
  table { border-collapse: collapse; width: 100%; }
  main { padding-left: 8px; padding-right: 8px; }
  .panel { padding: 8px 6px; }
  td input.text { width: 100%; min-width: 12em; }
  th, td { text-align: left; vertical-align: top; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 400; font-size: 0.8rem; background: #fbf9f5; position: sticky; top: 0; z-index: 2; }
  td.sticky, th.sticky { position: sticky; left: 0; background: #fff; z-index: 1; }
  th.sticky { z-index: 3; background: #fbf9f5; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; max-width: 34em; white-space: normal; }
  .chip { display: inline-flex; gap: 2px; align-items: center; padding: 0 3px 0 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 0.8rem; white-space: nowrap; }
  .chip input[type="number"] { width: 4.5em; }
  .chip button { border: 0; background: transparent; padding: 0 3px; color: var(--muted); }
  .chip.add { background: transparent; border-style: dashed; }
  .changed { background: var(--changed-bg) !important; border-color: var(--changed-line) !important; }
  .added { background: var(--mark-bg) !important; }
  .warn { color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }
  .bad { color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 0 5px; }
  .ok { color: var(--mark); background: var(--mark-bg); border-radius: 4px; padding: 0 5px; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1fr); gap: 14px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .slot { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  .slot .no { width: 1.8em; color: var(--muted); text-align: right; }
  .slot select { max-width: 22em; width: 100%; }
  table.totals td, table.totals th { white-space: normal; position: static; }
  table.totals td.num { text-align: right; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  .hidden { display: none; }
</style>
</head>

<header>
  <h1>Модулі, корпуси й конструктор</h1>

  <div class="bar">
    <button class="tab" data-tab="modules">Модулі</button>
    <button class="tab" data-tab="hulls">Корпуси</button>

    <button id="upload" type="button">Відкрити</button>
    <input id="upload-file" type="file" accept="application/json" hidden>
    <button id="reset" type="button">Скинути до сіду</button>
  </div>
</header>
<main>
  <section id="tab-modules"></section>

<script>
const seed = JSON.parse(document.getElementById("seed").textContent);
const storageKey = "aetheris-modules-v4";
const clone = (value) => JSON.parse(JSON.stringify(value));
const original = { modules: clone(seed.modules), hulls: clone(seed.hulls), characteristics: clone(seed.characteristics), group_chars: clone(seed.group_chars) };
let state = clone(original);
let ui = { tab: "modules", group: "all", hull: seed.hulls[0].code, race: false, slots: [] };

try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
  if (saved && saved.modules && saved.hulls) {
    state = saved;
  }
} catch (error) {
  state = clone(original);
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (error) {
    // The page keeps working without the storage.
  }
}

const esc = (text) => String(text).replace(/"/g, "&quot;");
const charName = (code) => (state.characteristics.find((item) => item.code === code) || { name: code }).name;
const groupName = (code) => seed.groups[code] || code;
const resourceName = (code) => seed.resources[code] || code;
const moduleByCode = (code) => state.modules.find((item) => item.code === code);
const hullByCode = (code) => state.hulls.find((item) => item.code === code);
const isModuleGroup = (group) => Number(group.slice(3)) <= 11;
const moduleGroups = Object.keys(seed.groups).filter((code) => Number(code.slice(3)) <= 11);
const roles = ["universal", "combat", "civil", "transport"];
const damageKinds = ["", "energy", "kinetic"];
const components = ["", "drive", "reactor"];

function groupColumns(group) {
  const set = new Set();
  for (const item of state.modules.filter((entry) => entry.group === group)) {
    Object.keys(item.chars).forEach((code) => set.add(code));
  }
  (state.group_chars[group] || []).forEach((entry) => set.add(entry.c));
  return state.characteristics.map((item) => item.code).filter((code) => set.has(code));
}

function mark(changed) {
  return changed ? "changed" : "";
}

function resourceChips(map, base, scope, id) {
  base = base || {};
  const chips = Object.keys(map).map((code) => {
    const status = !(code in base) ? "added" : base[code] !== map[code] ? "changed" : "";
    return `<span class="chip ${status}">${resourceName(code)} <input type="number" min="0" value="${map[code]}" data-ing="${scope}" data-id="${id}" data-code="${code}"><button type="button" data-ing-remove="${scope}" data-id="${id}" data-code="${code}">×</button></span>`;
  });
  const options = Object.entries(seed.resources).map(([code, name]) => `<option value="${code}">${name}</option>`).join("");
  chips.push(`<span class="chip add"><select data-ing-select="${scope}:${id}">${options}</select><button type="button" data-ing-add="${scope}" data-id="${id}">+</button></span>`);
  return `<div class="chips">${chips.join("")}</div>`;
}

function renderModules() {
  const groups = ui.group === "all" ? moduleGroups : [ui.group];
  const filters = ["all", ...moduleGroups].map((code) => `<button class="tab ${ui.group === code ? "active" : ""}" data-group="${code}">${code === "all" ? "Усі" : groupName(code)} <span class="small">(${state.modules.filter((entry) => code === "all" || entry.group === code).length})</span></button>`).join("");
  const blocks = groups.map((group) => {
    const rows = state.modules.filter((entry) => entry.group === group);
    const columns = groupColumns(group);
    const used = new Set(columns);
    const addOptions = state.characteristics.filter((item) => !used.has(item.code)).map((item) => `<option value="${item.code}">${item.name}</option>`).join("");
    const head = `<tr><th class="sticky">Назва</th><th>Код</th><th>Марка</th><th>Вага</th><th>Роль</th><th>Шкода</th><th>Компонент</th>${columns.map((code) => `<th>${charName(code)}<br><button type="button" class="small" title="Перейменувати параметр" data-char-rename="${code}">✎</button> <button type="button" class="small danger" title="Прибрати параметр у всій групі" data-col-remove="${group}" data-code="${code}">× параметр</button></th>`).join("")}<th>Завод</th><th>Рів. заводу</th><th>Час, с</th><th>Інгредієнти</th><th>Корпуси</th><th>Раси</th><th></th></tr>`;
    const body = rows.map((item) => {
      const base = original.modules.find((entry) => entry.code === item.code);
      const isNew = !base;
      const cell = (field, value, kind, isChar) => {
        const baseValue = base ? (isChar ? base.chars[field] : base[field]) : undefined;
        const changed = isNew ? "added" : mark(String(baseValue ?? "") !== String(value ?? ""));
        return `<input type="number" step="any" class="${changed}" value="${value ?? ""}" data-mod="${item.code}" data-field="${field}" ${isChar ? 'data-char="1"' : ""} ${kind || ""}>`;
      };
      const select = (field, options, current, isAttr) => {
        const baseValue = base ? (isAttr ? (base.attributes[field] || "") : base[field]) : undefined;
        return `<select class="${isNew ? "added" : mark(String(baseValue ?? "") !== String(current ?? ""))}" data-mod="${item.code}" data-field="${field}" ${isAttr ? 'data-attr="1"' : ""}>${options.map((option) => `<option value="${option}" ${option === (current ?? "") ? "selected" : ""}>${option || "—"}</option>`).join("")}</select>`;
      };
      const factoryOptions = ["", ...Object.keys(seed.factories)];
      const compatible = state.hulls.filter((hull) => item.hulls.includes(hull.code));
      const free = state.hulls.filter((hull) => !item.hulls.includes(hull.code));
      const hullPart = `<details><summary>${compatible.length} корпусів</summary><div class="chips">${compatible.map((hull) => `<span class="chip">${hull.name}<button type="button" data-hull-remove="${item.code}" data-code="${hull.code}">×</button></span>`).join("")}<span class="chip add"><select data-hull-select="${item.code}">${free.map((hull) => `<option value="${hull.code}">${hull.name}</option>`).join("")}</select><button type="button" data-hull-add="${item.code}">+</button></span></div></details>`;
      const racePart = `<details><summary>${item.races.length} рас</summary><div class="chips">${seed.races.map((race) => `<label class="chip"><input type="checkbox" ${item.races.includes(race) ? "checked" : ""} data-race="${item.code}" data-code="${race}"> ${race}</label>`).join("")}</div></details>`;
      const nameChanged = isNew ? "added" : mark(base.name !== item.name);
      return `<tr class="${isNew ? "added" : ""}">
        <td class="sticky"><input class="text ${nameChanged}" value="${esc(item.name)}" data-mod="${item.code}" data-field="name" data-text="1"></td>
        <td class="small">${item.code}</td>
        <td>${cell("mark", item.mark)}</td>
        <td>${cell("weight", item.weight)}</td>
        <td>${select("role", roles, item.attributes.role, true)}</td>
        <td>${select("damage_kind", damageKinds, item.attributes.damage_kind, true)}</td>
        <td>${select("component", components, item.attributes.component, true)}</td>
        ${columns.map((code) => `<td>${cell(code, item.chars[code], "", true)}</td>`).join("")}
        <td>${select("factory", factoryOptions, item.factory, false)}</td>
        <td>${cell("factory_level", item.factory_level)}</td>
        <td>${cell("duration", item.duration)}</td>
        <td>${resourceChips(item.ingredients, base && base.ingredients, "m", item.code)}</td>
        <td>${hullPart}</td>
        <td>${racePart}</td>
        <td><button type="button" class="small" title="Копія" data-mod-clone="${item.code}">копія</button> <button type="button" class="small danger" title="Видалити модуль" data-mod-delete="${item.code}">×</button></td>
      </tr>`;
    }).join("");
    const removed = original.modules.filter((entry) => entry.group === group && !state.modules.some((item) => item.code === entry.code));
    const addColumn = addOptions ? `<span class="chip add">+ параметр групі: <select data-col-select="${group}">${addOptions}</select><button type="button" data-col-add="${group}">+</button></span>` : "";
    return `<div class="panel"><b>${groupName(group)}</b> <span class="small">${rows.length} модулів</span> ${addColumn}
      <button type="button" class="small" data-char-new="${group}" title="Створити параметр, якого ще нема, наприклад тягу чи місткість">+ новий параметр</button>
      <button type="button" class="small" data-mod-add="${group}">+ новий модуль</button>
      ${removed.length ? `<span class="small">прибрано: ${removed.map((entry) => `<s>${entry.name}</s>`).join(" ")}</span>` : ""}
      <div class="scroll" style="margin-top:6px"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");
  document.getElementById("tab-modules").innerHTML = `<p class="note">Усі параметри модулів із сіду. Колонки залежать від групи (параметри групи + ті, що вже є в модулях). «× параметр» прибирає параметр у всіх модулях групи, «+ параметр» додає його з нулями. Кожен корпус, на який модуль ставиться, можна додати чи прибрати.</p><div class="filters">${filters}</div>${blocks}`;
}

const hullFixedChars = ["char_hull_size", "char_hull_capacity", "char_integrity", "char_hull_slots", "char_hull_race_slot"];

function hullExtraChars() {
  return state.characteristics.map((item) => item.code).filter((code) => !hullFixedChars.includes(code) && state.hulls.some((hull) => code in hull.chars));
}

function renderHulls() {
  const extra = hullExtraChars();
  const extraOptions = state.characteristics.filter((item) => !hullFixedChars.includes(item.code) && !extra.includes(item.code)).map((item) => `<option value="${item.code}">${item.name}</option>`).join("");
  const hullGroups = Object.keys(seed.groups).filter((code) => Number(code.slice(3)) > 11);
  const head = `<tr><th class="sticky">Назва</th><th>Код</th><th>Клас</th><th>Роль</th><th>Рів. Верфі</th><th>Розмір</th><th>Місткість</th><th>Міцність</th><th>Слоти</th><th>Расовий слот</th>${extra.map((code) => `<th>${charName(code)}<br><button type="button" class="small" data-char-rename="${code}">✎</button> <button type="button" class="small danger" data-hull-col-remove="${code}">× параметр</button></th>`).join("")}<th>Час, с</th><th>Інгредієнти</th><th>Модулів</th><th></th></tr>`;
  const body = state.hulls.map((hull) => {
    const base = original.hulls.find((entry) => entry.code === hull.code);
    const isNew = !base;
    const num = (field, value, isChar) => {
      const baseValue = base ? (isChar ? base.chars[field] : base[field]) : undefined;
      return `<input type="number" step="any" class="${isNew ? "added" : mark(String(baseValue ?? "") !== String(value ?? ""))}" value="${value ?? ""}" data-hull="${hull.code}" data-field="${field}" ${isChar ? 'data-char="1"' : ""}>`;
    };
    const groupOptions = hullGroups.map((code) => `<option value="${code}" ${code === hull.group ? "selected" : ""}>${groupName(code)}</option>`).join("");
    const roleOptions = ["combat", "transport", "drone", "civil"].map((role) => `<option ${role === hull.role ? "selected" : ""}>${role}</option>`).join("");
    return `<tr class="${isNew ? "added" : ""}">
      <td class="sticky"><input class="text ${isNew ? "added" : mark(base.name !== hull.name)}" value="${esc(hull.name)}" data-hull="${hull.code}" data-field="name" data-text="1"></td>
      <td class="small">${hull.code}</td>
      <td><select data-hull="${hull.code}" data-field="group" data-text="1">${groupOptions}</select></td>
      <td><select data-hull="${hull.code}" data-field="role" data-text="1">${roleOptions}</select></td>
      <td>${num("shipyard_level", hull.shipyard_level)}</td>
      <td>${num("char_hull_size", hull.chars.char_hull_size, true)}</td>
      <td>${num("char_hull_capacity", hull.chars.char_hull_capacity, true)}</td>
      <td>${num("char_integrity", hull.chars.char_integrity, true)}</td>
      <td>${num("char_hull_slots", hull.chars.char_hull_slots, true)}</td>
      <td>${num("char_hull_race_slot", hull.chars.char_hull_race_slot, true)}</td>
      ${extra.map((code) => `<td>${num(code, hull.chars[code], true)}</td>`).join("")}
      <td>${num("duration", hull.duration)}</td>
      <td>${resourceChips(hull.ingredients, base && base.ingredients, "h", hull.code)}</td>
      <td class="small">${state.modules.filter((entry) => entry.hulls.includes(hull.code)).length}</td>
      <td><button type="button" class="small danger" data-hull-delete="${hull.code}">×</button></td>
    </tr>`;
  }).join("");
  document.getElementById("tab-hulls").innerHTML = `<p class="note">Усі корпуси за порядком драбини. «Слоти» порожні означають стандартне значення сервера (${seed.default_slots}). Рівень Верфі це вимога відкриття корпусу (драбина).</p>
    <button type="button" data-hull-add-new="1">+ новий корпус</button>
    <button type="button" data-char-new="hulls">+ новий параметр корпусів</button>
    ${extraOptions ? `<span class="chip add">+ наявний параметр: <select data-hull-col-select="1">${extraOptions}</select><button type="button" data-hull-col-add="1">+</button></span>` : ""}
    <div class="scroll" style="margin-top:6px"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function allowedModules(hull) {
  return state.modules.filter((item) => !item.attributes.not_a_ship_module
    && item.hulls.includes(hull.code)
    && (item.attributes.role === "universal" || item.attributes.role === hull.role
      // The transport hull is a peaceful hull, so a peaceful module goes on it (the rule of the server).
      || (item.attributes.role === "civil" && hull.role === "transport")));
}

function renderBuilder() {
  const hull = hullByCode(ui.hull) || state.hulls[0];
  ui.hull = hull.code;
  const baseSlots = hull.chars.char_hull_slots || seed.default_slots;
  const raceSlot = ui.race && (hull.chars.char_hull_race_slot || 0) > 0 ? 1 : 0;
  const slotCount = Number(baseSlots) + raceSlot;
  while (ui.slots.length < slotCount) {
    ui.slots.push("");
  }
  ui.slots.length = slotCount;
  const allowed = allowedModules(hull);
  const groupsInAllowed = [...new Set(allowed.map((item) => item.group))];
  const slotsHtml = ui.slots.map((code, index) => `<div class="slot"><span class="no">${index + 1}</span><select data-slot="${index}"><option value="">— порожньо —</option>${groupsInAllowed.map((group) => `<optgroup label="${groupName(group)}">${allowed.filter((item) => item.group === group).map((item) => `<option value="${item.code}" ${item.code === code ? "selected" : ""}>${item.name}</option>`).join("")}</optgroup>`).join("")}</select></div>`).join("");
  const picked = ui.slots.filter(Boolean).map(moduleByCode).filter(Boolean);
  const totals = {};
  for (const [code, value] of Object.entries(hull.chars)) {
    if (["char_hull_slots", "char_hull_race_slot"].includes(code)) continue;
    totals[code] = { hull: Number(value) || 0, modules: 0 };
  }
  for (const item of picked) {
    for (const [code, value] of Object.entries(item.chars)) {
      totals[code] = totals[code] || { hull: 0, modules: 0 };
      totals[code].modules += Number(value) || 0;
    }
  }
  const weight = picked.reduce((sum, item) => sum + (Number(item.weight) || 0), 0);
  const power = totals.char_power ? totals.char_power.modules : 0;
  const use = totals.char_energy_use ? totals.char_energy_use.modules : 0;
  const thrust = totals.char_thrust ? totals.char_thrust.modules : 0;
  const hasDrive = picked.some((item) => item.attributes.component === "drive");
  const hasReactor = picked.some((item) => item.attributes.component === "reactor");
  const checks = [
    [picked.length <= slotCount, `Слоти: ${picked.length} з ${slotCount}`],
    [hasDrive, hasDrive ? "Двигун є" : "Немає двигуна"],
    [hasReactor, hasReactor ? "Реактор є" : "Немає реактора"],
    [use <= power, `Енергія: ${use.toLocaleString("uk-UA")} з ${power.toLocaleString("uk-UA")}${use > power ? " (не вистачає)" : ""}`],
  ];
  const rows = Object.entries(totals).map(([code, value]) => `<tr><td>${charName(code)}</td><td class="num">${value.hull ? value.hull.toLocaleString("uk-UA", { maximumFractionDigits: 2 }) : ""}</td><td class="num">${value.modules ? value.modules.toLocaleString("uk-UA", { maximumFractionDigits: 2 }) : ""}</td><td class="num"><b>${(value.hull + value.modules).toLocaleString("uk-UA", { maximumFractionDigits: 2 })}</b></td></tr>`).join("");
  const costs = {};
  for (const [code, amount] of Object.entries(hull.ingredients)) costs[code] = (costs[code] || 0) + amount;
  for (const item of picked) for (const [code, amount] of Object.entries(item.ingredients)) costs[code] = (costs[code] || 0) + amount;
  const buildTime = (hull.duration || 0) + picked.reduce((sum, item) => sum + (Number(item.duration) || 0), 0);
  const hullOptions = state.hulls.map((entry) => `<option value="${entry.code}" ${entry.code === hull.code ? "selected" : ""}>${entry.name}</option>`).join("");
  document.getElementById("tab-builder").innerHTML = `<p class="note">Оберіть корпус і модулі в слоти: підсумок рахується одразу. Показано лише модулі, що ставляться на цей корпус і підходять за роллю. Перевірки як на сервері: слоти, двигун, реактор, енергія.</p>
  <div class="grid">
    <div class="panel"><b>Корпус</b> <select id="builder-hull">${hullOptions}</select>
      ${(hull.chars.char_hull_race_slot || 0) > 0 ? `<label><input type="checkbox" id="builder-race" ${ui.race ? "checked" : ""}> расовий слот</label>` : ""}
      <div class="small">Клас ${groupName(hull.group)}, роль ${hull.role}, Верф ${hull.shipyard_level}, слотів ${slotCount}, доступних модулів ${allowed.length}</div>
      <div style="margin-top:8px">${slotsHtml}</div>
      <button type="button" id="builder-clear" class="small">Очистити слоти</button></div>
    <div class="panel"><b>Підсумок</b>
      <div class="chips" style="margin:6px 0">${checks.map(([ok, text]) => `<span class="${ok ? "ok" : "bad"}">${text}</span>`).join("")}</div>
      <table class="totals"><thead><tr><th>Параметр</th><th>Корпус</th><th>Модулі</th><th>Разом</th></tr></thead><tbody>${rows}
        <tr><td>Вага модулів</td><td></td><td class="num">${weight.toLocaleString("uk-UA", { maximumFractionDigits: 2 })}</td><td class="num"><b>${weight.toLocaleString("uk-UA", { maximumFractionDigits: 2 })}</b></td></tr>
        <tr><td>Тяга на одиницю ваги</td><td></td><td></td><td class="num"><b>${weight ? (thrust / weight).toLocaleString("uk-UA", { maximumFractionDigits: 2 }) : "—"}</b></td></tr>
        <tr><td>Баланс енергії</td><td></td><td></td><td class="num"><b>${(power - use).toLocaleString("uk-UA", { maximumFractionDigits: 2 })}</b></td></tr></tbody></table>
      <div class="small" style="margin-top:6px"><b>Вартість деталей (корпус + модулі):</b> ${Object.entries(costs).map(([code, amount]) => `${resourceName(code)} ${amount.toLocaleString("uk-UA")}`).join(", ") || "—"}<br><b>Час виробництва деталей:</b> ${buildTime.toLocaleString("uk-UA")} с</div></div>
  </div>`;
}

function changeCount() {
  let count = 0;
  const compare = (current, base) => {
    for (const key of new Set([...Object.keys(current), ...Object.keys(base)])) {
      if (JSON.stringify(current[key]) !== JSON.stringify(base[key])) count += 1;
    }
  };
  for (const item of state.modules) {
    const base = original.modules.find((entry) => entry.code === item.code);
    if (!base) { count += 1; continue; }
    compare({ ...item, chars: undefined, ingredients: undefined, hulls: undefined, races: undefined, attributes: undefined }, { ...base, chars: undefined, ingredients: undefined, hulls: undefined, races: undefined, attributes: undefined });
    compare(item.chars, base.chars); compare(item.ingredients, base.ingredients); compare(item.attributes, base.attributes);
    count += item.hulls.filter((code) => !base.hulls.includes(code)).length + base.hulls.filter((code) => !item.hulls.includes(code)).length;
    count += item.races.filter((code) => !base.races.includes(code)).length + base.races.filter((code) => !item.races.includes(code)).length;
  }
  count += original.modules.filter((entry) => !state.modules.some((item) => item.code === entry.code)).length;
  for (const hull of state.hulls) {
    const base = original.hulls.find((entry) => entry.code === hull.code);
    if (!base) { count += 1; continue; }
    compare({ ...hull, chars: undefined, ingredients: undefined }, { ...base, chars: undefined, ingredients: undefined });
    compare(hull.chars, base.chars); compare(hull.ingredients, base.ingredients);
  }
  count += original.hulls.filter((entry) => !state.hulls.some((hull) => hull.code === entry.code)).length;
  return count;
}

function render() {
  for (const tab of ["modules", "hulls", "builder"]) {
    document.getElementById("tab-" + tab).classList.toggle("hidden", ui.tab !== tab);
  }
  document.querySelectorAll("button.tab[data-tab]").forEach((button) => button.classList.toggle("active", button.dataset.tab === ui.tab));
  if (ui.tab === "modules") renderModules();
  if (ui.tab === "hulls") renderHulls();
  if (ui.tab === "builder") renderBuilder();
  document.getElementById("count").textContent = "Змін: " + changeCount();
}

function update() {
  save();
  render();
}

function nextCode(prefix, list) {
  let number = 1;
  while (list.some((item) => item.code === prefix + number)) number += 1;
  return prefix + number;
}

document.addEventListener("change", (event) => {
  const target = event.target;
  if (target.id === "builder-hull") { ui.hull = target.value; ui.slots = []; render(); return; }
  if (target.id === "builder-race") { ui.race = target.checked; render(); return; }
  if (target.dataset.slot !== undefined) { ui.slots[Number(target.dataset.slot)] = target.value; render(); return; }
  if (target.dataset.mod) {
    const item = moduleByCode(target.dataset.mod);
    const field = target.dataset.field;
    if (target.dataset.attr) {
      if (target.value === "") delete item.attributes[field]; else item.attributes[field] = target.value;
    } else if (target.dataset.char) {
      item.chars[field] = target.value === "" ? 0 : Number(target.value);
    } else if (target.dataset.text || ["factory", "role"].includes(field)) {
      item[field] = target.value === "" && field === "factory" ? null : target.value;
    } else {
      item[field] = target.value === "" ? null : Number(target.value);
    }
    update();
    return;
  }
  if (target.dataset.hull && target.dataset.field) {
    const hull = hullByCode(target.dataset.hull);
    const field = target.dataset.field;
    if (target.dataset.char) {
      if (target.value === "") delete hull.chars[field]; else hull.chars[field] = Number(target.value);
    } else if (target.dataset.text) {
      hull[field] = target.value;
    } else {
      hull[field] = target.value === "" ? null : Number(target.value);
    }
    update();
    return;
  }
  if (target.dataset.ing) {
    const owner = target.dataset.ing === "m" ? moduleByCode(target.dataset.id) : hullByCode(target.dataset.id);
    const value = Number(target.value);
    if (Number.isFinite(value) && value >= 0) owner.ingredients[target.dataset.code] = value;
    update();
    return;
  }
  if (target.dataset.race) {
    const item = moduleByCode(target.dataset.race);
    item.races = target.checked ? [...new Set([...item.races, target.dataset.code])] : item.races.filter((code) => code !== target.dataset.code);
    update();
  }
});

document.addEventListener("click", (event) => {
  const target = event.target;
  if (target.dataset.tab) { ui.tab = target.dataset.tab; render(); return; }
  if (target.dataset.group) { ui.group = target.dataset.group; render(); return; }
  if (target.dataset.ingRemove) {
    const owner = target.dataset.ingRemove === "m" ? moduleByCode(target.dataset.id) : hullByCode(target.dataset.id);
    delete owner.ingredients[target.dataset.code];
  } else if (target.dataset.ingAdd) {
    const owner = target.dataset.ingAdd === "m" ? moduleByCode(target.dataset.id) : hullByCode(target.dataset.id);
    const select = document.querySelector(`[data-ing-select="${target.dataset.ingAdd}:${target.dataset.id}"]`);
    owner.ingredients[select.value] = owner.ingredients[select.value] || 1;
  } else if (target.dataset.colRemove) {
    const group = target.dataset.colRemove;
    if (!confirm("Прибрати параметр «" + charName(target.dataset.code) + "» у всіх модулів групи «" + groupName(group) + "»?")) return;
    state.modules.filter((entry) => entry.group === group).forEach((entry) => { delete entry.chars[target.dataset.code]; });
    state.group_chars[group] = (state.group_chars[group] || []).filter((entry) => entry.c !== target.dataset.code);
  } else if (target.dataset.colAdd) {
    const group = target.dataset.colAdd;
    const code = document.querySelector(`[data-col-select="${group}"]`).value;
    state.modules.filter((entry) => entry.group === group).forEach((entry) => { entry.chars[code] = 0; });
    state.group_chars[group] = [...(state.group_chars[group] || []), { c: code, required: false }];
  } else if (target.dataset.charNew) {
    const name = (prompt("Назва нового параметра (наприклад: Тяга, Місткість):") || "").trim();
    if (!name) return;
    if (state.characteristics.some((item) => item.name.toLowerCase() === name.toLowerCase())) {
      alert("Параметр з такою назвою вже є: додайте його через «+ параметр».");
      return;
    }
    let number = 1;
    while (state.characteristics.some((item) => item.code === "custom_" + number)) number += 1;
    const code = "custom_" + number;
    state.characteristics.push({ code, name, kind: null });
    if (target.dataset.charNew === "hulls") {
      state.hulls.forEach((hull) => { hull.chars[code] = 0; });
    } else {
      state.modules.filter((entry) => entry.group === target.dataset.charNew).forEach((entry) => { entry.chars[code] = 0; });
      state.group_chars[target.dataset.charNew] = [...(state.group_chars[target.dataset.charNew] || []), { c: code, required: false }];
    }
  } else if (target.dataset.charRename) {
    const item = state.characteristics.find((entry) => entry.code === target.dataset.charRename);
    const name = (prompt("Нова назва параметра:", item.name) || "").trim();
    if (!name) return;
    item.name = name;
  } else if (target.dataset.hullColAdd) {
    const code = document.querySelector("[data-hull-col-select]").value;
    state.hulls.forEach((hull) => { hull.chars[code] = 0; });
  } else if (target.dataset.hullColRemove) {
    if (!confirm("Прибрати параметр «" + charName(target.dataset.hullColRemove) + "» у всіх корпусів?")) return;
    state.hulls.forEach((hull) => { delete hull.chars[target.dataset.hullColRemove]; });
  } else if (target.dataset.modDelete) {
    const item = moduleByCode(target.dataset.modDelete);
    if (!confirm("Видалити модуль «" + item.name + "»?")) return;
    state.modules = state.modules.filter((entry) => entry.code !== item.code);
  } else if (target.dataset.modClone || target.dataset.modAdd) {
    const source = target.dataset.modClone ? moduleByCode(target.dataset.modClone) : state.modules.filter((entry) => entry.group === target.dataset.modAdd).pop();
    const copy = clone(source);
    copy.code = nextCode("new_module_", state.modules);
    copy.name = source.name + " (новий)";
    state.modules.push(copy);
  } else if (target.dataset.hullRemove) {
    const item = moduleByCode(target.dataset.hullRemove);
    item.hulls = item.hulls.filter((code) => code !== target.dataset.code);
  } else if (target.dataset.hullAdd) {
    const item = moduleByCode(target.dataset.hullAdd);
    const code = document.querySelector(`[data-hull-select="${target.dataset.hullAdd}"]`).value;
    if (code) item.hulls = [...new Set([...item.hulls, code])];
  } else if (target.dataset.hullDelete) {
    const hull = hullByCode(target.dataset.hullDelete);
    if (!confirm("Видалити корпус «" + hull.name + "»?")) return;
    state.hulls = state.hulls.filter((entry) => entry.code !== hull.code);
    state.modules.forEach((entry) => { entry.hulls = entry.hulls.filter((code) => code !== hull.code); });
  } else if (target.dataset.hullAddNew) {
    const copy = clone(state.hulls[state.hulls.length - 1]);
    copy.code = nextCode("new_hull_", state.hulls);
    copy.name = copy.name + " (новий)";
    state.hulls.push(copy);
  } else if (target.id === "builder-clear") {
    ui.slots = [];
    render();
    return;
  } else {
    return;
  }
  update();
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Повернути дані сіду? Ваші зміни зникнуть.")) return;
  state = clone(original);
  ui.slots = [];
  update();
});

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ source: "aetheris modules", ...state }, null, 2)], { type: "application/json;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "moduli-ta-korpusy.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

document.getElementById("upload").addEventListener("click", () => document.getElementById("upload-file").click());
document.getElementById("upload-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const loaded = JSON.parse(await file.text());
    if (!loaded.modules || !loaded.hulls) throw new Error("shape");
    state = { modules: loaded.modules, hulls: loaded.hulls, characteristics: loaded.characteristics || state.characteristics, group_chars: loaded.group_chars || state.group_chars };
    ui.slots = [];
    update();
  } catch (error) {
    alert("Файл не схожий на модулі й корпуси цієї сторінки.");
  }
  event.target.value = "";
});

render();
</script>
</body>
</html>
