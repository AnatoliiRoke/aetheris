# Automatic dependency updates (task 00002, section 2.6).
# Dependabot opens a pull request when a pinned version has a newer release or a known
# vulnerability; the CI of the pull request checks the update.
#
# Updates are grouped to keep the number of pull requests small (task 00021). A major update
# never shares a pull request with minor and patch updates, so a breaking release can be
# held back without blocking the safe ones.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - minor
          - patch
      microsoft-major:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - major
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
        update-types:
          - minor
          - patch
      opentelemetry-major:
        patterns:
          - "OpenTelemetry*"
        update-types:
          - major

  # Major updates of the npm packages stay one per pull request: each of them may break the
  # build on its own (for example TypeScript or jsdom).
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
