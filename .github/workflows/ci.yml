name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aetheris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AETHERIS_DATABASE__CONNECTIONSTRING: >-
        Host=localhost;Port=5432;Database=aetheris_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
          cache: true
          cache-dependency-path: server/**/*.csproj

      - name: Restore
        working-directory: server
        run: dotnet restore

      - name: Build
        working-directory: server
        run: dotnet build --configuration Release --no-restore | tee build.log

      # The magic-number rule AETHERIS001 is a warning for now (task 00001, section 2.4).
      # Every finding is shown as an annotation on the pull request, so it is not lost in
      # the build log.
      - name: Report magic numbers
        working-directory: server
        run: |
          grep -E 'warning AETHERIS001' build.log | sort -u | while read -r line; do
            echo "::warning::$line"
          done || true

      - name: Test
        working-directory: server
        run: dotnet test --configuration Release --no-build

      - name: Check formatting
        working-directory: server
        run: dotnet format --verify-no-changes --no-restore

  client:
    name: Client build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
